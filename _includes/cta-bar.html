{% assign lang = page.lang | default: site.lang | default: "tr" %}
{% assign ui = site.data.ui[lang] %}
<div class="cta-bar" role="region" aria-label="{{ ui.whatsapp }}">
  <a rel="noopener noreferrer" href="tel:{{ site.phone_tel }}">{{ ui.cta_call }}</a>
  <a class="cta-main" rel="noopener noreferrer" href="https://wa.me/{{ site.whatsapp }}?text={{ ui.whatsapp_msg | uri_escape }}">{{ ui.cta_wa }}</a>
  <a href="{{ site.shop }}" rel="noopener noreferrer">{{ ui.shop }}</a>
</div>
