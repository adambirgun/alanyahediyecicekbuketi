- q: "Alanya’da çiçek buketi nasıl sipariş edilir?"
  a: "En kolayı WhatsApp. Mahalleyi ya da oteli, saati ve kabaca bir bütçe yazın. Tezgâhtan fotoğraf atarız; siz onaylayınca kurye çıkar. Kartla almak isterseniz sepet balconyflowers.com’da. Oba’ya veya Alanyum köşesine uğrayıp elden de alabilirsiniz."
- q: "Teslimat ücretli mi?"
  a: "Alanya içi kapıya teslimatı ücretsiz tutuyoruz. balconyflowers.com üzerinden 2000 TL ve üzeri siparişlerde Türkiye kargosu da ücretsiz görünür. Taze buket şehir dışına her zaman aynı gün gitmez; onu siparişte konuşalım."
- q: "Aynı gün gelir mi?"
  a: "Teslimat 10:30–18:00 arasında. Oba, Tosmur, Cikcilli ve merkeze yakın mahallelerde bu saatlerde aynı gün çıkıyoruz. Konaklı, Kargıcak, Payallar, Mahmutlar gibi daha uzun hatlarda önce saati kilitleyelim."
- q: "Hangi mahallelere gidiyorsunuz?"
  a: "Oba, Tosmur, Kestel, Mahmutlar, Cikcilli, Konaklı, Demirtaş, Kargıcak, Payallar, Türkler, Avsallar, İncekum, Okurcalar. Adresi yazın; o günkü yoğunluğa göre net saat verelim."
- q: "Nasıl ödeme yaparım?"
  a: "Mağazada nakit veya kart. WhatsApp siparişinde teslimatta ya da balconyflowers.com’daki ödeme ile. Trendyol’da da balconyflowers satıcısı var."
- q: "Saatler nedir?"
  a: "Mağaza her gün 08:30–19:30. Buket teslimatı 10:30–18:00. Bayramda kayabilir; yazmadan yola çıkmayın."
- q: "Aklımdaki buketi yapar mısınız?"
  a: "Evet. Oba’da dal dal bakarak kuruyoruz. Alanyum’da hazır duranlar var; özel iş için Oba veya WhatsApp daha doğru."
- q: "Bu site ile balconyflowers.com farkı nedir?"
  a: "Burası Alanya vitrini: mahalle, saat, iki mağaza, nasıl sipariş verilir. Sepet, kart ve güncel stok balconyflowers.com’da. İkisini birlikte kullanın; çiçek yine Oba’dan çıkar."
- q: "Kart notu yazar mısınız?"
  a: "Yazarız. Kısa tutun, kâğıda sığsın. İsimleri net yazın; kalıp cümle basmıyoruz, sizin cümleniz gider."
- q: "18:00’den sonra veya gece gelir misiniz?"
  a: "Buket kuryesi 18:00’de kesilir. Mağaza 19:30’a kadar açık; elden almak o saate kadar mümkün. Gece kapıya çıkış yok."
- q: "Çiçek soluk gelirse ne olur?"
  a: "Teslimde bakın. Dal kırık veya suyu gitmişse yazın, düzeltiriz. Sıcakta evde vazoyu gölgeye alın; klima üflemesin."
- q: "Otelden, yabancı dilde sipariş olur mu?"
  a: "Olur. WhatsApp’a oda numarasını ve saati yazmanız yeter. Sayfanın üstünden English, Deutsch veya Русский seçebilirsiniz. Kartlı alışveriş yine balconyflowers.com üzerinden."
- q: "Saksı bitkime bakar mısınız?"
  a: "Kesme buket işimiz ayrı. Evdeki saksı için sitede Bitki doktoru sayfası var: fotoğraf yükleyin, bakım listesi çıksın. Bu bir yardımcı araçtır, tarla teşhisi değildir. Saksı satışı veya ağır hastalık için WhatsApp’tan yazın."
