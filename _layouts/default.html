<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}" dir="ltr">
  {% include head.html %}
  <body>
    {% assign lang = page.lang | default: site.lang | default: "tr" %}
    {% assign ui = site.data.ui[lang] %}
    <a class="skip" href="#icerik">{{ ui.skip }}</a>
    <div class="chrome">
      {% include lang-bar.html %}
      {% include header.html %}
    </div>
    <main id="icerik">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include cta-bar.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% if page.clinic %}
    <script src="{{ '/assets/bitki-doktoru/data.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/bitki-doktoru/vision.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/bitki-doktoru/planner.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/bitki-doktoru/clinic.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
